# tmax-15k PRODUCTION-v2 — Qwen3.5-35B-A3B (MoE) PPO, TP8 correctness rollout on the CURRENT 56-GPU cluster (7 nodes x 8 H20),
# STANDARD (skim-oversample) rollout mode, DAYTONA backend.
#
# Hyperparameters mirror the 120-GPU "strongest" recipe
# (run_tmax15k_qwen35_120gpu_ppo_criticlr30x_strongest.sh + harbor_tmax15k_full_96gpu_27b_daytona_ppo_64k.yaml)
# with ONLY these deltas (per user):
#   - rollout_batch_size 512->256 (train window), n_samples_per_prompt = 1 (unchanged from source)
#   - oversample window 280->260 (matches the strongest wrapper's OVER_SAMPLING_BATCH_SIZE=260)
#   - TRAIN pool = the SHARED-FS converted tmax-15k (14601 tasks), NOT node-local /tmp tar-staging
#   - EVAL pool  = terminal-bench-2 (89 tasks) on the gy4 share
#   - topology reset to 56 GPU (32 train / 24 rollout) — set in the wrapper, not here
#
# All timeouts / agent / verifier / daytona knobs kept IDENTICAL to the source tmax yaml.

# Training pool: the converted tmax-15k (14601 task.toml dirs) on the shared fs (all nodes see it).
harbor_tasks_dir: /path/to/workspace/slime-terminal-RL_data/tmax15k_terminal_bench
harbor_tasks_glob: "*/task.toml"

# Held-out EVAL pool: the 89 Terminal-Bench 2 tasks (gy4 share, all nodes see it).
harbor_eval_tasks_dir: /path/to/workspace/terminal-bench-2-main
harbor_eval_tasks_glob: "*/task.toml"

harbor_trial_defaults:
  trials_dir: /path/to/workspace/slime_harbor_trials/tmax15k_35b_a3b_ppo_criticlr30x_strongest
  timeout_multiplier: 1.0
  agent:
    import_path: slime_plugins.harbor.agent:SlimeTerminus2
    model_name: slime-policy
    override_timeout_sec: 3600
    kwargs:
      parser_name: json
      max_turns: 60
      collect_rollout_details: true
      enable_summarize: true
      proactive_summarization_threshold: 20000
      trajectory_config:
        raw_content: true
        linear_history: true
      record_terminal_session: false
      llm_backend: slime_sglang
      llm_kwargs:
        apply_chat_template_kwargs:
          enable_thinking: false
        max_context_tokens: 64000
  verifier:
    override_timeout_sec: 900
  environment:
    type: daytona
    delete: true
    override_storage_mb: 10240
    kwargs:
      connection_pool_maxsize: 128
      auto_stop_interval_mins: 150
      auto_delete_interval_mins: 10

harbor_sample_mode: trajectory_retokenized
harbor_group_unit: trajectory
harbor_reward_key: reward

# n=1: group==task==sandbox. Fly 260 concurrent groups (max_concurrent_groups), accept
# the first 256 completed (rollout_batch_size in the wrapper), drop the slow tail.
# num_concurrent_trials is the sandbox-level semaphore; keep >= the in-flight cap.
harbor_num_concurrent_trials: 260
harbor_fully_async_max_concurrent_groups: 260
harbor_partial_group_min_units: 1

# Daytona per-org create limit 600/min (=10/s); pace to 6/s (matches source).
harbor_create_rate_per_sec: 6.0
harbor_create_rate_burst: 6.0

harbor_trial_node_spread: true
harbor_trials_per_node: 35
harbor_trial_worker_num_cpus: 0.05
harbor_trial_worker_startup_timeout_sec: 120
harbor_trial_worker_healthcheck_timeout_sec: 30
harbor_kill_unhealthy_trial_workers: false
harbor_fallback_to_inprocess_trials: false
harbor_trial_remote_timeout_sec: 5400

harbor_eval_total_timeout_sec: 10800
# Do not enter training unless the baseline is a complete, plausible TB2 pass@3.
harbor_eval_gate_enabled: true
harbor_eval_gate_expected_tasks: 89
harbor_eval_gate_expected_attempts: 267
harbor_eval_gate_min_resolved_rate_full: 0.35
harbor_eval_gate_max_resolved_rate_full: 0.45
rollout_cleanup_function_path: slime_plugins.harbor.fully_async_rollout.cleanup_rollout
harbor_fully_async_shutdown_drain_timeout_sec: 30
harbor_fully_async_shutdown_join_timeout_sec: 45

harbor_fail_on_conversion_error: true
harbor_fail_on_trial_error: false
harbor_require_full_rollout_groups: false
harbor_rollout_group_attempt_multiplier: 4
harbor_retry_missing_samples: 0

# Production-v2 rationale:
# - Training remains STANDARD skim-oversample: dispatch 260 groups, accept first 256.
# - Evaluation is a full 89-task pass and gets 3600s because rollout is 3xTP8 engines.
# - TP8 SGLang topology is set by the wrapper; it avoids the EP8/DP-attention quality path.
