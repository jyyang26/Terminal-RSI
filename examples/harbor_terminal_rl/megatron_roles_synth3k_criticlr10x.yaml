# Megatron per-role config for the synth3k standardOS288 RESUME run (2026-07-08).
#
# WHY THIS FILE EXISTS
# The 2-epoch run (iter_21) left the PPO critic UNDER-fit: rollout/explained_variance
# was NEGATIVE the whole way (-4.67 -> -1.84), i.e. the value head predicts worse than
# a constant. With V ~ noise, advantage = returns - V is noise, so the actor gets no
# usable gradient — the mechanistic reason train reward had zero slope over 22 steps.
#
# EV was RISING steadily (not stalled), so warm-loaded value head just needs more/faster
# calibration on synth-2820. Fix for the +4-epoch resume: keep the actor lr conservative
# (5e-7) but give the CRITIC a 10x-higher lr (5e-6) so the value head catches up faster.
#
# slime wires this via --megatron-config-path: create_training_models() calls
# parse_megatron_role_args(role="critic") which applies overrides.lr ONLY to the critic
# optimizer (slime/ray/placement_group.py:220-251; slime/utils/arguments.py:1546-1626).
# The actor keeps the top-level --lr from the wrapper (LR=5e-7). Format mirrors
# tests/test_qwen3_4B_ppo.py.
#
# NOTE: lr-decay-style is constant for both (matches the base run's --lr-decay-style
# constant), so max_lr == the effective lr throughout; no warmup/decay interaction.

megatron:
  - name: synth3k-actor
    role: actor
    overrides:
      lr: 5.0e-7
      min_lr: 5.0e-7

  - name: synth3k-critic
    role: critic
    overrides:
      lr: 5.0e-6
      min_lr: 5.0e-6
