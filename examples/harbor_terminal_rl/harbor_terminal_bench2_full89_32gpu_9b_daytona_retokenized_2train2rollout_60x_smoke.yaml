# Daytona smoke config for 32GPU Qwen3.5-9B Harbor training.
#
# Intended launch shape:
# - 2 actor/train nodes / 16 actor GPUs
# - 2 rollout/inference nodes / 16 rollout GPUs
# - 2 active task groups per rollout step
# - 32 trajectories per task group at the slime level
# - Daytona trial concurrency hard-capped below the 300GiB org quota
# - each Daytona sandbox storage override is 2GiB while orphan cleanup is unavailable

harbor_tasks_dir: /path/to/workspace/code/terminal-bench-2-main
harbor_tasks_glob: "*/task.toml"
harbor_tasks_offset: 0

harbor_trial_defaults:
  trials_dir: /path/to/workspace/slime_harbor_trials/tb2_full89_32gpu_9b_daytona_2train2rollout_60x_retokenized_smoke
  timeout_multiplier: 1.0
  agent:
    import_path: slime_plugins.harbor.agent:SlimeTerminus2
    model_name: slime-policy
    override_timeout_sec: 3600
    kwargs:
      parser_name: json
      max_turns: 100
      collect_rollout_details: true
      enable_summarize: false
      trajectory_config:
        raw_content: true
        linear_history: true
      record_terminal_session: false
      llm_backend: slime_sglang
      llm_kwargs:
        apply_chat_template_kwargs:
          enable_thinking: false
  environment:
    type: daytona
    delete: true
    override_storage_mb: 5120
    kwargs:
      connection_pool_maxsize: 128

harbor_sample_mode: trajectory_retokenized
harbor_group_unit: trajectory
harbor_reward_key: reward

# Daytona's current org cap is 300GiB, and running two 32-sample groups at once
# can exceed the quota even with 5GiB sandboxes. Keep one active group at a time
# for smoke coverage: each group still starts 32 samples and partial cutoff
# accepts the first 26 trainable trajectories.
harbor_num_concurrent_trials: 32
harbor_fully_async_max_concurrent_groups: 1
harbor_partial_group_min_units: 26
harbor_trial_node_spread: true
harbor_trials_per_node: 16
harbor_trial_worker_num_cpus: 0.05
harbor_trial_worker_startup_timeout_sec: 90
harbor_trial_worker_healthcheck_timeout_sec: 30
harbor_kill_unhealthy_trial_workers: false
harbor_fallback_to_inprocess_trials: false
harbor_trial_remote_timeout_sec: 21600
rollout_cleanup_function_path: slime_plugins.harbor.fully_async_rollout.cleanup_rollout
harbor_fully_async_shutdown_drain_timeout_sec: 30
harbor_fully_async_shutdown_join_timeout_sec: 45

harbor_fail_on_conversion_error: true
harbor_fail_on_trial_error: false
harbor_require_full_rollout_groups: true
harbor_rollout_group_attempt_multiplier: 8
harbor_retry_missing_samples: 0
