# Megatron per-role config: critic lr = 20x actor (2026-07-10 rerun).
#
# WHY THIS FILE EXISTS
# The 2026-07-09 Qwen3.6-27B run used critic lr = 10x actor (5e-6). That run
# PROVED cold-start critic + 10x lr gets explained_variance from -39 to +0.01
# (vs 3.5 warm-load stuck at -1.8, never positive) — critic learns fine. But
# rollout reward stayed FLAT (~0.72, regression t~0), so the bottleneck is the
# DATA, not the critic. That run's actor ckpt was ALSO clobbered by the critic
# (the --megatron-config-path path skipped _isolate_critic_checkpoint_dirs; fixed
# in placement_group.py, see tests/test_critic_checkpoint_isolation.py).
#
# THIS RERUN: push critic lr to 20x (1.0e-5) to see if an even faster value head
# changes anything, and shrink oversampling to 260 (near 1.0x, more faithful
# sampling, less skimming survivorship bias). Actor lr stays conservative at 5e-7.
#
# slime wires this via --megatron-config-path: create_training_models() calls
# parse_megatron_role_args(role="critic") which applies overrides.lr ONLY to the
# critic optimizer. The actor keeps top-level --lr from the wrapper (LR=5e-7).
#
# NOTE: lr-decay-style constant for both (matches base run's --lr-decay-style
# constant), so max_lr == effective lr throughout; no warmup/decay interaction.

megatron:
  - name: synth3k-actor
    role: actor
    overrides:
      lr: 5.0e-7
      min_lr: 5.0e-7

  - name: synth3k-critic
    role: critic
    overrides:
      lr: 1.0e-5
      min_lr: 1.0e-5
