# Full terminal-bench-2 Harbor rollout config for the v0.3 Qwen3.5-9B
# fully-async trajectory_retokenized smoke run on 32 GPUs.
#
# Layout expected by the launcher:
# - 1 actor node / 8 actor GPUs
# - 3 rollout nodes / 24 rollout GPUs
# - 3 task groups per train update
# - 32 trajectories per task group
# - unified 64k rollout / SGLang / actor train context, 3600s timeout
#
# This config intentionally keeps trajectory_retokenized enabled. The smoke is
# meant to verify that assistant-history span recording works in live rollout and
# that 64k train samples do not hit the previous actor OOM cliff.

harbor_tasks_dir: /path/to/workspace/code/terminal-bench-2-main
harbor_tasks_glob: "*/task.toml"
harbor_tasks_offset: 0

harbor_trial_defaults:
  trials_dir: /path/to/workspace/slime_harbor_trials/tb2_full89_32gpu_9b_max100_actor1_rollout3_batch3_n32_resp4096_ctx64k_traincap64k_timeout3600_trajectory_retokenized_smoke
  timeout_multiplier: 1.0
  agent:
    import_path: slime_plugins.harbor.agent:SlimeTerminus2
    model_name: slime-policy
    override_timeout_sec: 3600
    kwargs:
      parser_name: json
      max_turns: 100
      collect_rollout_details: true
      enable_summarize: false
      trajectory_config:
        raw_content: true
        linear_history: true
      record_terminal_session: false
      llm_backend: slime_sglang
      llm_kwargs:
        apply_chat_template_kwargs:
          enable_thinking: false
  environment:
    import_path: slime_plugins.harbor.singularity_env:SlimeSingularityEnvironment
    kwargs:
      singularity_image_cache_dir: /path/to/workspace/harbor_sif_cache_tb2_full_harbor_runtime
      singularity_fakeroot: false
      singularity_drop_caps: CAP_PERFMON,CAP_BPF,CAP_CHECKPOINT_RESTORE
      singularity_disable_memory_watchdog: true
      singularity_no_mount: home,tmp,bind-paths,proc
      singularity_bind_host_proc: true
      singularity_registry_proxy: http://star-proxy.oa.com:3128
      singularity_registry_mirror: docker.1panel.live

harbor_sample_mode: trajectory_retokenized
harbor_group_unit: trajectory
harbor_reward_key: reward

# Keep fully-async work aligned with the intended batch shape:
# 3 active task groups * 32 samples/group = 96 active trajectories.
harbor_num_concurrent_trials: 96
harbor_fully_async_max_concurrent_groups: 3
harbor_trial_node_spread: true
harbor_trials_per_node: 32
harbor_trial_worker_num_cpus: 0.05
harbor_trial_worker_startup_timeout_sec: 60
harbor_trial_worker_healthcheck_timeout_sec: 30
harbor_kill_unhealthy_trial_workers: false
harbor_fallback_to_inprocess_trials: false
harbor_trial_remote_timeout_sec: 21600
rollout_cleanup_function_path: slime_plugins.harbor.fully_async_rollout.cleanup_rollout
harbor_fully_async_shutdown_drain_timeout_sec: 30
harbor_fully_async_shutdown_join_timeout_sec: 45

harbor_fail_on_conversion_error: true
harbor_fail_on_trial_error: false
harbor_require_full_rollout_groups: true
harbor_rollout_group_attempt_multiplier: 8
harbor_retry_missing_samples: 0
