# Loaded by slime --custom-config-path. Keys become attributes on `args`.

harbor_tasks_dir: /path/to/workspace/code/terminal-bench-2-main
harbor_tasks_glob: "regex-log/task.toml"
harbor_tasks_limit: 1
harbor_tasks_offset: 0

harbor_trial_defaults:
  trials_dir: /tmp/slime-harbor-terminal-bench2-trials
  timeout_multiplier: 1.0
  agent:
    import_path: slime_plugins.harbor.agent:SlimeTerminus2
    model_name: slime-policy
    kwargs:
      parser_name: json
      max_turns: 20
      collect_rollout_details: true
      enable_summarize: false
      record_terminal_session: false
      llm_backend: slime_sglang
      llm_kwargs:
        apply_chat_template_kwargs:
          enable_thinking: false
  environment:
    import_path: slime_plugins.harbor.singularity_env:SlimeSingularityEnvironment
    kwargs:
      singularity_image_cache_dir: /tmp/slime-harbor-terminal-bench2-sif-cache
      singularity_no_mount: home,tmp,bind-paths,proc
      singularity_bind_host_proc: true
      singularity_registry_proxy: http://star-proxy.oa.com:3128
      singularity_registry_no_proxy: ".woa.com,mirrors.cloud.tencent.com,tlinux-mirror.tencent-cloud.com,tlinux-mirrorlist.tencent-cloud.com,localhost,127.0.0.1,mirrors-tlinux.tencentyun.com,.oa.com,.local,.3gqq.com,.7700.org,.ad.com,.ada_sixjoy.com,.addev.com,.app.local,.apps.local,.aurora.com,.autotest123.com,.bocaiwawa.com,.boss.com,.cdc.com,.cdn.com,.cds.com,.cf.com,.cjgc.local,.cm.com,.code.com,.datamine.com,.dvas.com,.dyndns.tv,.ecc.com,.expochart.cn,.expovideo.cn,.fms.com,.great.com,.hadoop.sec,.heme.com,.home.com,.hotbar.com,.ibg.com,.ied.com,ieg.local,.ierd.com,.imd.com,.imoss.com,.isd.com,.isoso.com,.itil.com,.kao5.com,.kf.com,.kitty.com,.lpptp.com,.m.com,.matrix.cloud,.matrix.net,.mickey.com,.mig.local,.mqq.com,.oiweb.com,.okbuy.isddev.com,.oss.com,.otaworld.com,.paipaioa.com,.qqbrowser.local,.qqinternal.com,.qqwork.com,.rtpre.com,.sc.oa.com,.sec.com,.server.com,.service.com,.sjkxinternal.com,.sllwrnm5.cn,.sng.local,.soc.com,.t.km,.tcna.com,.teg.local,.tencentvoip.com,.tenpayoa.com,.test.air.tenpay.com,.tr.com,.tr_autotest123.com,.vpn.com,.wb.local,.webdev.com,.webdev2.com,.wizard.com,.wqq.com,.wsd.com,.sng.com,.music.lan,.mnet2.com,.tencentb2.com,.tmeoa.com,.pcg.com,www.wip3.adobe.com,www-mm.wip3.adobe.com,mirrors.tencent.com,csighub.tencentyun.com,.myqcloud.com,.tencentcos.cn"
      singularity_registry_mirror: docker.1panel.live

harbor_sample_mode: turn
harbor_reward_key: reward
harbor_num_concurrent_trials: 1
harbor_fail_on_conversion_error: true
harbor_fail_on_trial_error: false
