# Daytona oversampling + long-tail-kill SMOKE config for 96-H20 Qwen3.5-27B,
# training on the WGDS-v3 Round9 valid359 dataset.
#
# GOAL OF THIS SMOKE: test whether (a) Daytona sandbox host + (b) oversampling
# with long-tail cutoff + (c) shorter per-trial budget raises rollout GPU
# utilization vs the 256-concurrent singularity run.
#
# Derived from two PROVEN configs (minimal deltas, each marked >>EXP):
#   - 9B Daytona smoke  (daytona environment block, partial-cutoff args)
#       harbor_terminal_bench2_full89_32gpu_9b_daytona_retokenized_2train2rollout_60x_smoke.yaml
#   - 27B trajnorm run  (agent kwargs, sample mode, summarize)
#       harbor_terminal_bench2_full89_96gpu_27b_max120_..._trajectory_normalized_fully_async.yaml
#
# Layout (unchanged from the 27B run): 12 nodes x 8 GPU = 96 GPU
#   - 4 actor nodes / 32 actor GPUs, TP2 x PP8 x CP2 = 32
#   - 8 rollout nodes / 64 rollout GPUs, 32 x TP2 SGLang engines
#
# EXPERIMENT KNOBS (set here + in the run shell):
#   n_samples_per_prompt = 20   (shell)   <- was 32; sample each task 20x not 32x
#   harbor_partial_group_min_units = 16   <- accept first 16/group, CANCEL the tail 4
#   rollout_batch_size = 2      (shell)   <- 2 groups per train step => 16*2=32 trained
#   max_turns = 100                       <- was 120; cap agent steps
#   override_timeout_sec = 2400           <- was 3600; 40-min per-trial wallclock
#   environment.type = daytona            <- cloud sandbox host (was singularity)
#
# QUOTA NOTE (Daytona TIER4 org cap = 5000GiB): in-flight sandboxes =
#   max_concurrent_groups * n_samples = 16 * 20 = 320.  320 * 5GiB = 1600GiB < 5000GiB. OK.
#   The 5000GiB tier4 quota removes the old 300GiB wall (which had forced
#   max_concurrent_groups=1-2). The binding limit is now SGLang inference
#   saturation (32 TP2 engines) + Daytona sandbox-creation rate, NOT disk quota.
#   Headroom: 5000/5 = 1000 sandboxes max; 320 leaves room to push higher later.

# >>EXP: train on the Daytona-image-rewritten valid359 copy (see
# prepare_valid359_daytona_dataset.sh). Tasks live at the TOP level as
# wgds9-<name>/task.toml (no `tasks/` subdir), hence the glob below.
harbor_tasks_dir: /path/to/workspace/code/harbor_dataset_step4_valid359_daytona
harbor_tasks_glob: "wgds9-*/task.toml"
harbor_tasks_offset: 0

harbor_trial_defaults:
  trials_dir: /path/to/workspace/slime_harbor_trials/valid359_96gpu_27b_daytona_n20_partial16_max100_timeout2400_smoke
  timeout_multiplier: 1.0
  agent:
    import_path: slime_plugins.harbor.agent:SlimeTerminus2
    model_name: slime-policy
    # >>EXP: 40-min per-trial wallclock (was 3600).
    override_timeout_sec: 2400
    kwargs:
      parser_name: json
      # >>EXP: cap agent at 100 steps (was 120).
      max_turns: 100
      collect_rollout_details: true
      # Keep summarize ON (proven 27B fix for the 84% context-exceeded failure
      # mode; not part of this experiment). Summarizes via the same slime-policy.
      enable_summarize: true
      # >>FIX (smoke run 1 hit "exceeds context limit (65536)" x1295): the default
      # proactive_summarization_threshold=8000 (terminus_2.py:159) leaves too small
      # a buffer for terminal agents — one turn can dump a huge command output and
      # blow past 8k before the next summarization check, so by the time it fires
      # the prompt is ~62k and the summary's own call (62k+4k) exceeds the 64k wall
      # and fails. Raise the buffer to 20k so summarization triggers at ~44k prompt,
      # leaving room for the summary call even after a large single-turn jump.
      proactive_summarization_threshold: 20000
      trajectory_config:
        raw_content: true
        linear_history: true
      record_terminal_session: false
      llm_backend: slime_sglang
      llm_kwargs:
        apply_chat_template_kwargs:
          enable_thinking: false
        # >>FIX: pin the agent's context limit just under the SGLang-served 65536
        # (get_model_context_limit, llm.py:189-192; default falls back to the
        # tokenizer model_max_length, which may NOT equal the served window). This
        # makes free_tokens / summarization triggers track the REAL wall, and the
        # llm.py:104 guard pre-empts over-limit calls cleanly instead of a 400.
        max_context_tokens: 64000
  # >>EXP: Daytona cloud sandbox host instead of local singularity/SIF.
  # The valid359 copy's task.toml docker_image is now a REGISTRY tag
  # (alexgshaw/mteb-leaderboard:20251031), which Daytona's Image.base() can pull.
  environment:
    type: daytona
    delete: true
    override_storage_mb: 5120
    kwargs:
      connection_pool_maxsize: 128

harbor_sample_mode: trajectory_retokenized
harbor_group_unit: trajectory
harbor_reward_key: reward

# >>EXP: oversampling + long-tail cutoff.
#   - launch n_samples_per_prompt (20) trials per group
#   - once 16 trainable trajectories complete, CANCEL the remaining in-flight
#     trials (ray.cancel) so the group closes without waiting on the slow tail
#   - 16 groups in flight at once => 320 concurrent sandboxes (well under tier4 5000GiB)
harbor_num_concurrent_trials: 320
harbor_fully_async_max_concurrent_groups: 16
harbor_partial_group_min_units: 16

harbor_trial_node_spread: true
# 320 concurrent trials across 8 rollout nodes => 40 trial-worker actors/node.
# Daytona TrialWorkers are lightweight orchestrators (num_cpus=0.05 => 40*0.05=2
# CPU/node); the actual sandbox compute is remote, so this is not RAM/CPU-bound.
# Must satisfy trials_per_node * rollout_nodes >= num_concurrent_trials (40*8=320).
harbor_trials_per_node: 40
harbor_trial_worker_num_cpus: 0.05
harbor_trial_worker_startup_timeout_sec: 90
harbor_trial_worker_healthcheck_timeout_sec: 30
harbor_kill_unhealthy_trial_workers: false
harbor_fallback_to_inprocess_trials: false
harbor_trial_remote_timeout_sec: 21600
rollout_cleanup_function_path: slime_plugins.harbor.fully_async_rollout.cleanup_rollout
harbor_fully_async_shutdown_drain_timeout_sec: 30
harbor_fully_async_shutdown_join_timeout_sec: 45

harbor_fail_on_conversion_error: true
harbor_fail_on_trial_error: false
# require_full + partial_min: a group is "full" once partial_min (16) units land.
harbor_require_full_rollout_groups: true
harbor_rollout_group_attempt_multiplier: 8
harbor_retry_missing_samples: 0
