# tmax-15k FULL config: 14601 synthesized terminal tasks on Daytona, 96-GPU Qwen3.5-27B
# fully-async. PPO (actor-critic + GAE), raw mode, KL OFF, no rollout-logprobs.
# length reward OFF. Used by run_tmax15k_full_96gpu_27b_daytona_ppo_64k_fully_async.sh.
#
# >>NEW DATASET (2026-07-01): switches the training pool from the 89 TB2 tasks to the
# 14601-task tmax-15k synthesized corpus. This is a REAL training run (NOT overfit):
#   - TRAIN pool = tmax-15k (14601 tasks), n=1 (each task rolled out ONCE).
#   - EVAL pool  = the 89 Terminal-Bench 2 tasks (held-out generalization, NOT in train).
#     train != eval, so eval pass-rate measures TRANSFER to TB2, with a comparable
#     history (the overfit runs' step-10 eval was 0.548 on this same TB2 set).
#
# >>DATA LOCATION: tmax-15k lives on each node's LOCAL /tmp (NOT shared fs) at
# /tmp/tmax_harbor_15k_full. The launcher extracts it; each rollout node extracts its
# own copy from the shared-fs tar before the run (HarborTrialWorker reads task dirs
# node-locally). The TB2 eval set stays on shared fs (all nodes see it).
#
# >>n=1 + length reward: length_shaped_reward ranks trajectories WITHIN a group to shape
# by length; with n=1 each group has a single trajectory, so it degenerates to a pure
# pass-through (no length bonus). We therefore DISABLE length reward (lambda=0 in the
# wrapper) -- training is on the plain binary terminal reward.
#
# >>OVERSAMPLE: fly 280 concurrent groups (= 280 sandboxes, since n=1 -> 1 traj/group),
# accept the first 256 completed groups and drop the slow tail (rollout_batch_size=256,
# max_concurrent_groups=280). Daytona quota comfortably exceeds 280 (prior runs' census
# reached 800-900 active sandboxes).
#
# Window: 64k (the proven-safe full-length recipe), set by the wrapper's 5 context walls.
# Timeout patches in effect: NCCL group 30min + Gloo barrier 60min (both crash fixes).

# Training pool: the full tmax-15k synthesized set (14601 task.toml dirs).
# task dirs sit at <dir>/task_NNNNNN_<hash>/task.toml; default "*/task.toml" matches.
# No offset/limit -> all 14601, consumed in sorted order, cycled across epochs.
harbor_tasks_dir: /tmp/tmax_harbor_15k_full
harbor_tasks_glob: "*/task.toml"

# Held-out EVAL pool: the 89 Terminal-Bench 2 tasks (shared fs, all nodes see it).
# Independent cursor from training; iterated in full once per eval pass.
harbor_eval_tasks_dir: /path/to/workspace/code/terminal-bench-2-main
harbor_eval_tasks_glob: "*/task.toml"

harbor_trial_defaults:
  trials_dir: /path/to/workspace/slime_harbor_trials/tmax15k_full_ppo_64k
  timeout_multiplier: 1.0
  agent:
    import_path: slime_plugins.harbor.agent:SlimeTerminus2
    model_name: slime-policy
    override_timeout_sec: 3600
    kwargs:
      parser_name: json
      max_turns: 60
      collect_rollout_details: true
      enable_summarize: true
      proactive_summarization_threshold: 20000
      trajectory_config:
        raw_content: true
        linear_history: true
      record_terminal_session: false
      llm_backend: slime_sglang
      llm_kwargs:
        apply_chat_template_kwargs:
          enable_thinking: false
        # 4th of 5 context walls: Terminus2 agent's own budget. 64k matches the
        # proven full-length recipe; wrapper sets the other 4 walls to 65536.
        max_context_tokens: 64000
  verifier:
    override_timeout_sec: 900
  environment:
    type: daytona
    delete: true
    override_storage_mb: 10240
    kwargs:
      connection_pool_maxsize: 128
      # auto_stop (90min > 60min agent budget) + auto_delete (10min) backstop against
      # leaked sandboxes whose stop() never ran. Healthy trials are deleted immediately.
      auto_stop_interval_mins: 90
      auto_delete_interval_mins: 10

harbor_sample_mode: trajectory_retokenized
harbor_group_unit: trajectory
harbor_reward_key: reward

# >>OVERSAMPLE 280 / TRAIN 256 (2026-07-01): n=1 means group==task==sandbox. Fly 280
# concurrent groups (max_concurrent_groups), accept first 256 (rollout_batch_size in the
# wrapper), drop the slow tail. num_concurrent_trials is the sandbox-level semaphore;
# raise it to 280 so it never throttles the 280 in-flight groups. partial_group_min_units
# is irrelevant at n=1 (a group is "full" at 1 unit) but kept at 1 for clarity.
harbor_num_concurrent_trials: 280
harbor_fully_async_max_concurrent_groups: 280
harbor_partial_group_min_units: 1

# >>DAYTONA CREATE RATE LIMIT (2026-07-01): Daytona enforces a PER-ORG sandbox
# .create() limit of 600/min (=10/s). Firing all 280 groups at once = ~280/s burst
# = ~28x over the limit -> every trial dies with "Generic S3 error: HEAD
# .../context.tar after 10 retries" (this stopped the run TWICE). max_concurrent_groups
# still controls the in-flight CAP (280); this paces the create RATE so the 280
# come up over ~time instead of in one burst. Daytona advised 6/s (not 8) AND a
# ~15min cool-down after a burst overage before retrying (penalty/backoff window),
# plus possibly client-side exponential backoff on create failures. 6/s = 360/min,
# well under the 10/s ceiling. 0 = no limit (old behavior).
harbor_create_rate_per_sec: 6.0
harbor_create_rate_burst: 6.0

harbor_trial_node_spread: true
# 8 rollout nodes. trials_per_node is a throughput hint (sandboxes run remotely on
# Daytona, not on local GPUs), not a hard cap; 280/8=35 per node. Trial workers are
# I/O-light (0.05 CPU, mostly waiting on remote Daytona).
harbor_trials_per_node: 35
harbor_trial_worker_num_cpus: 0.05
harbor_trial_worker_startup_timeout_sec: 120
harbor_trial_worker_healthcheck_timeout_sec: 30
harbor_kill_unhealthy_trial_workers: false
harbor_fallback_to_inprocess_trials: false
harbor_trial_remote_timeout_sec: 5400

# Coordinator-side TOTAL eval wall: bounds the entire TB2-89 eval gather; at the
# deadline, pending eval tasks are cancelled and pass-rate is scored on what finished.
harbor_eval_total_timeout_sec: 3600
rollout_cleanup_function_path: slime_plugins.harbor.fully_async_rollout.cleanup_rollout
harbor_fully_async_shutdown_drain_timeout_sec: 30
harbor_fully_async_shutdown_join_timeout_sec: 45

harbor_fail_on_conversion_error: true
harbor_fail_on_trial_error: false
harbor_require_full_rollout_groups: false
harbor_rollout_group_attempt_multiplier: 12
harbor_retry_missing_samples: 0
