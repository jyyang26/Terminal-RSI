# Harbor rollout config for the 56-GPU (7-node x 8 H20) Qwen3.5-35B-A3B
# (MoE, 256 experts top-8, hybrid GatedDeltaNet linear attention) fully-async PPO run,
# using the DAYTONA cloud-sandbox backend.
#
# Derived from:
#   * harbor_terminal_bench2_56gpu_35b_a3b_..._trajectory_normalized_fully_async.yaml
#       (the GRPO sibling: MoE agent/sample semantics + this cluster's daytona block)
#   * harbor_tb2_full89_96gpu_27b_daytona_ppo_n4.yaml
#       (the PPO n=4 concurrency / group-oversampling pattern)
#
# PPO vs the GRPO sibling (algorithm + reward live in the WRAPPER; this file only
# changes concurrency / grouping):
#   - n=4 (wrapper N_SAMPLES_PER_PROMPT=4) instead of 32. PPO's advantage uses the
#     critic's per-trajectory GAE baseline (get_advantages_and_returns_batch), NOT a
#     group-relative mean, so multi-sampling per prompt is redundant. n=4 keeps the
#     group plumbing well-formed while the batch is rebuilt from more distinct PROMPTS.
#   - GROUP-LEVEL oversampling only: partial_group_min_units=4 (= n, so NO within-group
#     tail-cancel -- all 4 trials of a prompt are collected) + max_concurrent_groups
#     > the steady-state prompt window, so fast groups cover slow ones (Daytona
#     long-tail hedge) without shrinking PPO's effective batch.
#
# Layout (7 nodes x 8 GPU = 56 GPU): 4 actor nodes / 32 GPU (TP2 x PP1 x CP1 x EP8,
# DP16; CP MUST be 1 -- GatedDeltaNet recurrent scan is not context-parallel-safe;
# the PPO critic shares these 32 GPUs), 3 rollout nodes / 24 GPU (MoE served with
# dp-attention + EP8, 1 SGLang engine per 8-GPU node => 3 engines).
#
# NOTE: the launcher patches harbor_tasks_dir / trials_dir via sed at start; or set
# your own on-disk paths here. HARBOR_TASKS_DIR must be a dir of "*/task.toml".

harbor_tasks_dir: ${HARBOR_TASKS_DIR}
harbor_tasks_glob: "*/task.toml"
harbor_tasks_offset: 0

harbor_trial_defaults:
  trials_dir: ${HARBOR_TRIALS_DIR}
  timeout_multiplier: 1.0
  agent:
    import_path: slime_plugins.harbor.agent:SlimeTerminus2
    model_name: slime-policy
    # Agent wall-clock budget: 3600s. Overrides each task.toml timeout_sec.
    override_timeout_sec: 3600
    kwargs:
      parser_name: json
      max_turns: 120
      collect_rollout_details: true
      # summary ON: Terminus2 LLM-summarizes via the SAME slime-policy when free
      # tokens run low; the trajectory_normalized stitcher keeps loss masking correct.
      enable_summarize: true
      trajectory_config:
        raw_content: true
        linear_history: true
      record_terminal_session: false
      llm_backend: slime_sglang
      llm_kwargs:
        apply_chat_template_kwargs:
          enable_thinking: false
        max_context_tokens: 64000
  # Verifier hard wall 900s (15min): bounds the trial at agent(<=3600s) + verifier.
  verifier:
    override_timeout_sec: 900
  # Daytona cloud sandbox backend. Requires DAYTONA_API_KEY in the run env (the base
  # script forwards it into the Ray runtime_env). Healthy trials are deleted by
  # stop(); auto_stop/auto_delete only catch leaked sandboxes.
  environment:
    type: daytona
    delete: true
    override_storage_mb: 10240
    kwargs:
      connection_pool_maxsize: 128
      auto_stop_interval_mins: 90     # > 60min agent wall, so a live trial is never reaped
      auto_delete_interval_mins: 10

harbor_sample_mode: trajectory_normalized
harbor_group_unit: trajectory
harbor_reward_key: reward

# PPO n=4 grouping. NO within-group tail-cancel (partial_group_min_units = n = 4, so a
# group is accepted only when all 4 trajectories are in). GROUP-LEVEL oversampling:
# max_concurrent_groups=24 (> the per-step prompt window) lets fast groups cover for
# slow ones -- the Daytona long-tail hedge. 24 groups x 4 trials = 96 concurrent
# sandboxes. Tune num_concurrent_trials / max_concurrent_groups to your Daytona quota.
harbor_num_concurrent_trials: 96
harbor_fully_async_max_concurrent_groups: 24
harbor_partial_group_min_units: 4
harbor_trial_node_spread: true
harbor_trial_worker_num_cpus: 0.05
harbor_trial_worker_startup_timeout_sec: 120
harbor_trial_worker_healthcheck_timeout_sec: 30
harbor_kill_unhealthy_trial_workers: false
harbor_fallback_to_inprocess_trials: false
harbor_trial_remote_timeout_sec: 5400
rollout_cleanup_function_path: slime_plugins.harbor.fully_async_rollout.cleanup_rollout
harbor_fully_async_shutdown_drain_timeout_sec: 30
harbor_fully_async_shutdown_join_timeout_sec: 45

harbor_fail_on_conversion_error: true
harbor_fail_on_trial_error: false
# With min_units = n = 4, a full group needs all 4 units. Accept partial groups so a
# single failed/leaked trial doesn't force a whole group to be retried/dropped.
harbor_require_full_rollout_groups: false
harbor_rollout_group_attempt_multiplier: 12
harbor_retry_missing_samples: 0
