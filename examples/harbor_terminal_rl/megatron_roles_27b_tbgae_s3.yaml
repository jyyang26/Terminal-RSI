# TB-GAE (S3: gamma=lambda=1.0) role config, warm-critic RUN2 hyperparameters.
#
# TB-GAE keys are ROOT-LEVEL (siblings of `megatron:`), NOT under any role's overrides
# (slime/utils/tb_gae_config.py::reject_tb_role_overrides hard-rejects TB keys under
# overrides/args). resolve_tb_gae_config reads them from the role-config top level.
#
# S3 = gamma_turn = lambda_turn = 1.0 (no turn discounting; the report's first curve).
# For S4 copy this file and set both to 0.999.
#
# ==== THIS IS FOR A CONTROLLED GPU SMOKE, NOT PRODUCTION ====
# As of 2026-09-29 the truncation bootstrap + cross-chunk continuation are implemented
# and pass CPU tests, but have NEVER executed on GPU / TP4xCP4xPP2 / 256k. This config is
# for the report's "受控 S3 GPU smoke" step, which must pass before any mixed3000 full run.

enable_tb_gae: true
tb_gae_gamma_turn: 1.0
tb_gae_lambda_turn: 1.0

megatron:
  - name: q38-27b-actor
    role: actor
    overrides:
      lr: 5.0e-7
      min_lr: 5.0e-7
      # clip_grad inherits top-level 1.0 (RUN2).
  - name: q38-27b-critic
    role: critic
    overrides:
      lr: 1.5e-5
      min_lr: 1.5e-5
      value_clip: 4.0
      clip_grad: 100.0
