# OVERFIT config: Terminal-Bench 2 FULL 89 tasks on Daytona, 96-GPU Qwen3.5-27B
# fully-async. PPO (actor-critic + GAE) + length-aware reward shaping, raw mode,
# KL OFF, no rollout-logprobs. Used by
# run_tb2_full89_96gpu_27b_daytona_ppo_lenreward_overfit_64k_fully_async.sh.
#
# >>64k VARIANT (2026-06-27): identical to the 96k overfit config EXCEPT this caps the
# Terminus2 agent context budget at 64000 (the 4th of 5 context walls; the other 4 are
# env-driven in the 64k wrapper) and uses a separate trials_dir. This reverts to the
# ppo_033051 64k recipe that trained cleanly end-to-end. Rationale: debug-train-only
# deadlocks at step0 in EVERY window (64k included) -- it is a mode artifact, NOT a
# 96k/topology/code problem (memory debug-train-only-deadlocks-at-step0-not-real-run),
# so we go back to a REAL run at the proven-safe 64k length.
#
# A/B sibling of harbor_tb2_full89_96gpu_27b_daytona_gspo_lenreward_overfit.yaml:
# IDENTICAL task pools, trial config, Daytona infra, and concurrency -- the ONLY
# differences are the algorithm (PPO vs GSPO, set in the wrapper, not here) and the
# trials_dir (separate so the two runs' trial artifacts don't collide).
#
# GOAL: deliberately OVERFIT the 89 TB2 tasks (train pool == eval pool). Training
# and held-out eval draw from the SAME 89-task set, so eval pass-rate directly
# tracks how well the policy memorizes/solves the target tasks.
#
# >>TIMEOUT: override_timeout_sec 3600 (kept from the GSPO overfit run). The mid830
# eval diagnosis showed ~40-46% of eval trajectories were status=TRUNCATED, which in
# this pipeline means the Harbor agent hit the WALL-CLOCK timeout
# (asyncio.wait_for(agent.run, timeout=_agent_timeout_sec) -> AgentTimeoutError,
# mapped to Sample.Status.TRUNCATED in atif_adapter.py). Those truncated
# trajectories had pass-rate ~0 while *completed* ones passed ~60%. Doubling the
# budget from 1800 to 3600s gives long tasks room to finish. Applies to BOTH
# training and eval trials. COST NOTE: longer per-trial budget => longer Daytona
# sandbox lifetimes => more spend.
#
# REWARD DESIGN (unchanged from the GSPO overfit run for a clean A/B):
#   - PPO advantage estimator (wrapper: ADVANTAGE_ESTIMATOR=ppo, EPS_CLIP=0.2,
#     NUM_CRITIC_ONLY_STEPS=1). use_critic is derived from the estimator; the critic
#     shares the actor's placement group (no extra GPUs).
#   - length-aware reward shaping ON (HARBOR_LENGTH_REWARD_LAMBDA=0.4).
#   - entropy loss OFF; KL OFF; rollout-logprobs OFF.
#   - token-capping postprocess KEPT.

# Training pool == eval pool: the full Terminal-Bench 2 set (89 */task.toml).
# No offset/limit -> all 89 tasks, consumed in sorted order and cycled across
# epochs by the data source.
harbor_tasks_dir: /path/to/workspace/code/terminal-bench-2-main
harbor_tasks_glob: "*/task.toml"

# Held-out EVAL pool: the SAME 89 TB2 tasks (this is an overfit run -- eval
# pass-rate measures memorization of the target set). Independent cursor from
# training (HarborTaskDataSource.eval_entries), iterated in full once per eval
# pass without advancing the training cursor.
harbor_eval_tasks_dir: /path/to/workspace/code/terminal-bench-2-main
harbor_eval_tasks_glob: "*/task.toml"

harbor_trial_defaults:
  trials_dir: /path/to/workspace/slime_harbor_trials/tb2_full89_overfit_ppo_lenreward_64k
  timeout_multiplier: 1.0
  agent:
    import_path: slime_plugins.harbor.agent:SlimeTerminus2
    model_name: slime-policy
    # >>TIMEOUT: 1800 -> 3600 (see header). Overrides each task.toml timeout_sec.
    override_timeout_sec: 3600
    kwargs:
      parser_name: json
      max_turns: 60
      collect_rollout_details: true
      enable_summarize: true
      # context-wall fix proven in the valid359 + tiny runs.
      proactive_summarization_threshold: 20000
      trajectory_config:
        raw_content: true
        linear_history: true
      record_terminal_session: false
      llm_backend: slime_sglang
      llm_kwargs:
        apply_chat_template_kwargs:
          enable_thinking: false
        # 64k (2026-06-27): 退回到 ppo_033051 已验证跑通的 64k 全链路. Terminus2 agent
        # 自己的上下文预算: 到这个值就摘要/unwind, 所以 agent 永远不让 prompt 超过它. 这是
        # 第 4 道墙; 不降到 64k, 上面 wrapper 把 SGLang/slime 墙降回 64k 也白搭 (agent 会让
        # 历史涨到 96k, 再被训练侧 _hard_trim 从尾部砍到 64k = 在截断轨迹上训练). 与 wrapper
        # 的 ROLLOUT_MAX_CONTEXT_LEN=65536 配套 (略小于它, 留 max_new_tokens 余量).
        max_context_tokens: 64000
  # VERIFIER HARD WALL (added 2026-06-19). The agent step and the verifier step
  # are TWO independent asyncio.wait_for budgets in trial.run() (trial.py:840 /
  # :863). We only set the AGENT budget (override_timeout_sec=3600); the verifier
  # had NO override, so it fell back to each task.toml's own verifier.timeout_sec
  # x timeout_multiplier -- effectively unbounded for slow tasks. The
  # tb2of_raw_20260619_102014 baseline eval long-tail (e.g. g18) finished its
  # agent loop in ~15min but then hung in verification, keeping its sandbox alive
  # >70min and stalling eval_0.pt. Capping the verifier at 900s (15min) bounds the
  # whole trial at agent(<=3600s) + verifier(<=900s) + setup/teardown (~ a few
  # min) <= ~75min, comfortably under the coordinator remote_timeout (5400s/90min)
  # and the Daytona idle auto-delete (90min). A verifier that blows the 15min wall
  # is treated as a failed trial (reward=0) -- a test suite that can't even finish
  # is, for RL purposes, an unsolved task. 900s is generous vs typical TB2 verifier
  # runtimes (seconds to low minutes).
  verifier:
    override_timeout_sec: 900
  environment:
    type: daytona
    delete: true
    override_storage_mb: 10240
    kwargs:
      connection_pool_maxsize: 128
      # Backstop against sandbox LEAKS (a stop() that never ran -- e.g. a
      # creation-race or a shutdown cancellation, the path that orphaned 308
      # sandboxes after tb2of_raw_20260620_062054 exited). Daytona's
      # auto_delete clock only starts AFTER a sandbox is STOPPED, so
      # auto_delete alone is inert while a leaked sandbox stays `started`
      # forever (auto_stop defaults to 0 = never). You MUST also set auto_stop:
      #   leaked sandbox idle -> auto_stop after 90min -> auto_delete 10min later.
      # auto_stop must exceed the agent wall budget (override_timeout_sec=3600s
      # =60min) so a live trial -- even one blocked in a single long command --
      # is never reaped mid-run; 90 > 60 leaves margin. Healthy trials are still
      # deleted immediately by stop(); these knobs only catch the leaks.
      auto_stop_interval_mins: 90
      auto_delete_interval_mins: 10

harbor_sample_mode: trajectory_retokenized
harbor_group_unit: trajectory
harbor_reward_key: reward

# >>正式 overfit 并发256 (2026-06-26): batch64/n4 (wrapper) → 64 groups 在飞 x n4 = 256
# concurrent sandboxes，1:1 喂满 32 个 SGLang 引擎 (x2 in-flight)，rollout 吞吐拉满。
# 硬约束: 256 == 64 (groups) x 4 (n) == 32 (per_node) x 8 (rollout nodes)。
# min_units=4 = 不砍尾 (n4 全收齐才算一组完成)。NCCL new_group timeout 修复已验证
# (见 PPO_INTEGRATION_NOTES.md §5.10)，CP2@96k 训练 forward 不再死锁。
harbor_num_concurrent_trials: 256
harbor_fully_async_max_concurrent_groups: 64
harbor_partial_group_min_units: 4

harbor_trial_node_spread: true
# >>CP2-96k (2026-06-25): rollout 64 GPU = 8 rollout nodes。硬约束
# num_concurrent_trials == trials_per_node × num_rollout_nodes: 256 == 32 × 8。
# Trial workers are I/O-light (0.05 CPU, mostly waiting on remote
# Daytona). base launcher already raises nofile to the hard limit. Engines 32 (64 GPU /
# 2 per engine). 正式 overfit: trials_per_node 32 (32×8 rollout nodes = 256).
harbor_trials_per_node: 32
harbor_trial_worker_num_cpus: 0.05
harbor_trial_worker_startup_timeout_sec: 120
harbor_trial_worker_healthcheck_timeout_sec: 30
harbor_kill_unhealthy_trial_workers: false
harbor_fallback_to_inprocess_trials: false
# Coordinator-side per-trial wall (asyncio.wait_for around the worker's
# run_trial Ray future, rollout.py:697). 5400 (90min): safely above the 3600s
# agent budget + setup/verify, so a real slow trial is never killed, but a
# lost-future stall self-heals in <=90min: wait_for fires TimeoutError ->
# ray.cancel + retry on the next worker (rollout.py:711-723).
harbor_trial_remote_timeout_sec: 5400

# Coordinator-side TOTAL eval wall (added 2026-06-19). The per-trial remote_timeout
# above only bounds ONE trial attempt; on timeout the worker loop RETRIES the same
# eval task on the next worker, so a task whose trial DETERMINISTICALLY hangs costs
# one remote_timeout PER worker and stalls the whole eval for hours. This wall
# bounds the ENTIRE eval gather: at the deadline, _generate_eval_async cancels
# whatever eval tasks are still pending and scores pass-rate on the tasks that
# finished (a task that can never finish counts as a fail, which is correct).
# 3600s (60min) is generous vs a healthy full-89 eval while capping the
# pathological tail. 0 disables it.
harbor_eval_total_timeout_sec: 3600
rollout_cleanup_function_path: slime_plugins.harbor.fully_async_rollout.cleanup_rollout
harbor_fully_async_shutdown_drain_timeout_sec: 30
harbor_fully_async_shutdown_join_timeout_sec: 45

harbor_fail_on_conversion_error: true
harbor_fail_on_trial_error: false
harbor_require_full_rollout_groups: false
harbor_rollout_group_attempt_multiplier: 12
harbor_retry_missing_samples: 0
