# Full terminal-bench-2 Harbor rollout config for the 4x8 H20 job.
#
# This is the 32-GPU full-task run: one node is reserved for Megatron actor
# training and three nodes are used for SGLang rollout + Harbor TrialWorkers.

harbor_tasks_dir: /path/to/workspace/code/terminal-bench-2-main
harbor_tasks_glob: "*/task.toml"
harbor_tasks_offset: 0

harbor_trial_defaults:
  trials_dir: /path/to/workspace/slime_harbor_trials/tb2_full89_32gpu_max100_last_turn
  timeout_multiplier: 1.0
  agent:
    import_path: slime_plugins.harbor.agent:SlimeTerminus2
    model_name: slime-policy
    kwargs:
      parser_name: json
      max_turns: 100
      collect_rollout_details: true
      enable_summarize: false
      record_terminal_session: false
      llm_backend: slime_sglang
      llm_kwargs:
        apply_chat_template_kwargs:
          enable_thinking: false
  environment:
    import_path: slime_plugins.harbor.singularity_env:SlimeSingularityEnvironment
    kwargs:
      singularity_image_cache_dir: /path/to/workspace/harbor_sif_cache_tb2_full_harbor_runtime
      singularity_no_mount: home,tmp,bind-paths,proc
      singularity_bind_host_proc: true
      singularity_registry_proxy: http://star-proxy.oa.com:3128
      singularity_registry_mirror: docker.1panel.live

harbor_sample_mode: last_turn
harbor_reward_key: reward

# Three rollout nodes with four TrialWorkers per node gives 12 concurrent
# Terminus containers. n=16 groups will run in two waves, which is slower than
# 64-GPU but avoids overloading each node with too many Apptainer containers.
harbor_num_concurrent_trials: 12
harbor_trial_node_spread: true
harbor_trials_per_node: 4
harbor_trial_worker_num_cpus: 0.05
harbor_trial_worker_startup_timeout_sec: 30
harbor_trial_worker_healthcheck_timeout_sec: 5
harbor_trial_remote_timeout_sec: 14400

harbor_fail_on_conversion_error: true
harbor_fail_on_trial_error: false

# Keep GRPO prompt groups complete. Small rollout_batch_size plus extra
# backfill attempts is safer than relaxing group completeness, because slime's
# default GRPO reward normalization only preserves per-prompt grouping when the
# flattened batch has exactly rollout_batch_size * n_samples_per_prompt samples.
harbor_require_full_rollout_groups: true
harbor_rollout_group_attempt_multiplier: 8
harbor_retry_missing_samples: 0
