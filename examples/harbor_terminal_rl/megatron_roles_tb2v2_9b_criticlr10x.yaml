# Megatron per-role config for 9B TB2 train-v2 PPO overfit reruns.
#
# Actor keeps the wrapper's conservative top-level LR (5e-7). The PPO critic gets
# 10x LR (5e-6) so the value head calibrates faster; parse_megatron_role_args()
# applies role=critic overrides only to the critic optimizer.

megatron:
  - name: tb2v2-9b-actor
    role: actor
    overrides:
      lr: 5.0e-7
      min_lr: 5.0e-7

  - name: tb2v2-9b-critic
    role: critic
    overrides:
      lr: 5.0e-6
      min_lr: 5.0e-6
