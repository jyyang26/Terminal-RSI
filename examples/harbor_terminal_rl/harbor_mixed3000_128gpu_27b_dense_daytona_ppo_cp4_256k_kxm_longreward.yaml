# 27B Dense (Qwen3.5/3.8-27B) Terminal PPO @ 256k context, 128 GPU, Daytona.
#
# Derived from harbor_strategy15k_122b_a10b_daytona_ppo_cp4_bs512_84k_partial_reward.yaml
# (per instruction: anything not explicitly specified matches that file). Deltas are
# marked >>CHANGED / >>NEW with the reason.
#
# ============================ MODEL IS DENSE ============================
# The source checkpoint's common.pt reports num_experts=None -> this is a DENSE
# 27B, not the 122B MoE the base template targets. All MoE/EP arguments are
# therefore ABSENT, not set to 1:
#   no --num-experts, no --moe-*, no --expert-model-parallel-size,
#   no --expert-tensor-parallel-size.
# The base template's "EP*ETP must divide TP*CP*DP" constraint does not apply.
#
# Verified architecture (checkpoint common.pt + /path/to/models/Qwen3.8-27B/config.json):
#   num_layers 64 | hidden 5120 | ffn 17408 | heads 24 | num_query_groups 4
#   kv_channels/head_dim 256 | vocab 248320 | full_attention_interval 4
#   layer_types = [linear, linear, linear, full] x 16  (GatedDeltaNet hybrid)
#   max_position_embeddings 262144  <-- 256k is NATIVE, not an extrapolation
#
# ============================ TOPOLOGY: 128 GPU ============================
#   Trainer 64 GPU (8 nodes): TP=4 x CP=4 x PP=2 => DP=2
#   Rollout 64 GPU (8 nodes): 16 SGLang engines x TP=4
#
#   TP=4 is the CEILING: Megatron requires num_query_groups % TP == 0 and this
#   model has only 4 query groups. TP=8 -> 4/8 = 0.5 and is ILLEGAL, both for
#   Megatron and for the SGLang rollout engines. (The 122B template's TP=2/TP=8
#   choices do not transfer.)
#   PP=2 -> 32 layers/stage, and 32 % full_attention_interval(4) == 0, so every
#   stage gets whole [lin,lin,lin,full] blocks.
#   DP=2 -> GLOBAL_BATCH_SIZE 256 % 2 == 0. OK.
#   CP=4 -> local T = 262144/4 = 65536.
#
# CP=4 is mandatory and was validated before writing this config, via
# tests/test_qwen3_5_gdn_cp_correctness.py on the real GDN kernels:
#   CP=2 T=4096  : out_maxdiff 9.537e-07, grad 1.192e-07, mem 1.56x (ideal 2x)
#   CP=4 T=65536 : out_maxdiff 0.000e+00, grad 1.192e-07, mem 3.96x (ideal 4x)
# CP>1 additionally REQUIRES fla.ops.cp, which ships in the `fla-core` package
# (NOT in `flash-linear-attention`, despite the error message naming it).
# fla-core==0.4.2 + flash-linear-attention==0.4.2 installed and verified on all
# 16 nodes; without it actor.py's detect_and_setup_hybrid_cp path raises at step 1.
#
# ============================ 256k MEMORY RISK ============================
# The binding term is the vocab-projection / cross-entropy peak on the last
# pipeline stage, which scales with local_T * vocab and is INDEPENDENT of model
# size (27B weights are only ~6.3 GB/GPU at TP4*PP2).
# Calibrated against the base template's measured figures (84k: CP2 -> 29.8 GB,
# CP4 -> 14.9 GB; exactly 2.996 bytes/token/vocab):
#   256k CP=4 -> local 65536 -> ~45.4 GB   <-- dominant single term on a 97.9 GB H20
#   256k CP=8 -> local 32768 -> ~22.7 GB
# So log-prob chunking is NOT optional here. TRAINING_INTERRUPTION_FAILURES.md
# records repeated 27B OOMs at this exact vocab in the fused vocab CE, including
# a 128k run that OOM'd at TP=1/PP=8/CP=2, and notes that LOG_PROBS_CHUNK_SIZE=32
# alone was insufficient -- "需要 TP 分摊，不只是调 chunk". We therefore combine
# TP=4 sharding + CP=4 + chunk 32 + full recompute.
#
# CRITICAL, from the same postmortem (line ~1582): a token cap like
# MAX_TOKENS_PER_GPU only bounds batch PACKING; it cannot split a single sample
# that is already longer than the cap. A 256k single sample is therefore the
# real OOM risk, and HARBOR_MAX_TRAIN_TOTAL_TOKENS (the train-side wall) is the
# knob that actually bounds it. Both are set in the launch wrapper.
#
# ============================ CRITIC: COLD START ============================
# Backbone copied from the actor checkpoint; value head randomly initialised.
# This needs NO manual weight surgery -- slime does it natively:
#   1. placement_group.py:_isolate_critic_checkpoint_dirs suffixes only the
#      critic's --save to <save>_critic; --load is deliberately NOT suffixed, so
#      the critic loads the SAME backbone as the actor.
#   2. model.py:_critic_output_layer_needs_reinit sees the shape mismatch
#      (actor LM head [248320, 5120] vs critic value head [1, 5120]).
#   3. model.py:_reinitialize_critic_output_layer then runs AFTER load_checkpoint:
#        weight.normal_(mean=0.0, std=0.02); bias.zero_()
#      plus optimizer.reload_model_params() for bf16.
# A <load>_critic sibling MUST NOT exist, or the critic silently takes the
# WARM-load path and the requested cold start is defeated. Verified absent.

# ---------------------------------------------------------------------------
# DATA: the unified 3000-task pool (2400 + 600)
# ---------------------------------------------------------------------------
# >>CHANGED: harbor_tasks_dir points at a symlink directory that unions the two
# requested pools. This is REQUIRED, not cosmetic: the two pools sit at
# DIFFERENT nesting depths, harbor_tasks_dir takes a single Path, and
# data_source.py:232 calls glob.glob(pattern) WITHOUT recursive=True, so:
#     <root>/*/*/task.toml           -> 600   (silently 20% of the data)
#     <root>/**/task.toml            -> 0     (** == * without recursive=True)
#     <root>/{d1,d2}/*/task.toml     -> 0     (python glob has no brace expansion)
# Both wrong answers fail SILENTLY. build_unified_task_dir.py creates the union
# and asserts 3000 discoverable, provenance D1=2400 / D2=600, no name collisions,
# no dead symlinks. Re-run it if either pool changes.
harbor_tasks_dir: /path/to/workspace/slime-terminal-RL_data/software_reconstruction/mixed3000_27b_ppo_256k_symlink
harbor_tasks_glob: "*/task.toml"

# Same as reference: rollout_shuffle required for this pool.
# >>RUN2: this flag was ALREADY true in run #1 but had NO EFFECT on the Harbor pool:
# it is consumed by slime core's RolloutDataSourceWithBuffer (data_source.py:85),
# whereas this run uses HarborTaskDataSource, which walked `sorted(glob(...))` with a
# monotonic cursor and never shuffled. Because the task names are family-prefixed,
# each 256-task batch was an alphabetically contiguous block -- measured 5-6 families
# per batch, i.e. a whole batch of uniformly hard or uniformly easy tasks.
# HarborTaskDataSource now honours the flag (per-epoch permutation seeded from
# rollout_seed + epoch): measured 46 families per batch, each task still visited
# exactly once per epoch, and the order is reproducible across actors and resumes.
rollout_shuffle: true
# Explicit so the permutation is reproducible; ROLLOUT_SEED is NOT plumbed through the
# launcher chain, so setting it here is the only path that actually reaches args.
rollout_seed: 42

# Held-out eval pool: the 89 Terminal-Bench 2 tasks. >>CHANGED to the sh9 copy
# (the reference path is on gy4/cq11, which this cluster does not mount).
# NOTE: two copies exist on sh9 at DIFFERENT depths -- verified task counts:
#   terminal-bench-2/   -> 89 via "*/task.toml"        <-- used here
#   terminal-bench-2-1/ -> 89 via "tasks/*/task.toml"  (would need a different glob)
# Using the wrong pair silently yields 0 eval tasks.
harbor_eval_tasks_dir: /path/to/workspace/terminal-bench-2
harbor_eval_tasks_glob: "*/task.toml"

harbor_trial_defaults:
  # >>CHANGED: sh9 trials dir for this run.
  trials_dir: /path/to/workspace/slime_harbor_trials/q38_27b_ppo_256k_mixed3000
  timeout_multiplier: 1.0
  agent:
    import_path: slime_plugins.harbor.agent:SlimeTerminus2
    model_name: slime-policy
    override_timeout_sec: 3600
    kwargs:
      parser_name: json
      # >>CHANGED 60 -> 500. MEASURED: 60 was a BINDING cap, not a safety margin.
      # In run #2 dump 20, 196/256 trajectories (76.6%) ended at EXACTLY 60 turns,
      # and 84% of those failed; censoring rose 46.5% (step 0) -> 76.6% (step 20).
      # `harbor/avg_turns_per_trajectory` was therefore a right-censored statistic:
      # its ~52 mean is "76% pinned at the ceiling + 24% early-stop", so it cannot
      # be read as a behavioural trend in either direction.
      # On terminal-bench-2 eval the same cap binds: failed tasks have MEDIAN
      # turns == 60 while solved tasks median 10 -- i.e. every hard task is cut off
      # mid-solve. Raising to 500 uncensors the metric and lets long tasks finish.
      # COST: wall-clock per rollout may rise. The real limits still bind first --
      # agent override_timeout_sec=3600 and the 229376-token compaction threshold --
      # so 500 is a ceiling that should rarely be reached, not a new target.
      # Watch `harbor/avg_turns_per_trajectory` and `perf/rollout_time` after this.
      max_turns: 500
      collect_rollout_details: true
      enable_summarize: true
      # >>CHANGED 65536 -> 229376 per the 256k spec: total window 262144 with the
      # LAST 32k reserved for the summarization/compaction pass.
      #   262144 - 32768 = 229376
      proactive_summarization_threshold: 229376
      trajectory_config:
        raw_content: true
        linear_history: true
      record_terminal_session: false
      llm_backend: slime_sglang
      llm_kwargs:
        apply_chat_template_kwargs:
          enable_thinking: false
        # >>CHANGED 86016 -> 262144: the agent-visible 256k context ceiling.
        max_context_tokens: 262144
  verifier:
    override_timeout_sec: 900
  environment:
    type: daytona
    delete: true
    override_storage_mb: 10240
    kwargs:
      connection_pool_maxsize: 128
      auto_stop_interval_mins: 90
      auto_delete_interval_mins: 10

# ---------------------------------------------------------------------------
# SAMPLE / REWARD plumbing -- identical to the reference
# ---------------------------------------------------------------------------
harbor_sample_mode: trajectory_retokenized
harbor_group_unit: trajectory
harbor_reward_key: reward

# >>CHANGED: concurrency scaled from the reference's 560 (which pairs with
# bs512) down to the bs256 ratio used here. 280/256 keeps the same ~1.09x skim
# ratio the reference documents for 560/512.
harbor_num_concurrent_trials: 280
harbor_fully_async_max_concurrent_groups: 280
harbor_partial_group_min_units: 1
harbor_create_rate_per_sec: 6.0
harbor_create_rate_burst: 6.0
harbor_trial_node_spread: true
# >>CHANGED 70 -> 35: 280 trials over 8 rollout nodes (reference was 560 over 8).
harbor_trials_per_node: 35
harbor_trial_worker_num_cpus: 0.05
harbor_trial_worker_startup_timeout_sec: 120
harbor_trial_worker_healthcheck_timeout_sec: 30
harbor_kill_unhealthy_trial_workers: false
harbor_fallback_to_inprocess_trials: false
harbor_trial_remote_timeout_sec: 5400
harbor_eval_total_timeout_sec: 10800
rollout_cleanup_function_path: slime_plugins.harbor.fully_async_rollout.cleanup_rollout
harbor_fully_async_shutdown_drain_timeout_sec: 30
harbor_fully_async_shutdown_join_timeout_sec: 45
harbor_fail_on_conversion_error: true
harbor_fail_on_trial_error: false
harbor_require_full_rollout_groups: false
harbor_rollout_group_attempt_multiplier: 12
harbor_retry_missing_samples: 0


# ====================================================================================
# CTRF DENSE REWARD SCALE (run #2)
# ====================================================================================
# The divisor in shaped = passed / SCALE. Set HERE in the yaml rather than via
# HARBOR_TESTCOUNT_SCALE because the env var never reaches the Ray workers: the
# inner launcher's RUNTIME_ENV_JSON (run_qwen35_9b_terminal_bench2_64h20.sh:752-797)
# lists HARBOR_PARTIAL_REWARD_MAX / HARBOR_LENGTH_REWARD_LAMBDA /
# HARBOR_MAX_TRAIN_TOTAL_TOKENS but NOT HARBOR_TESTCOUNT_SCALE, and this run uses
# `ray job submit` (DIRECT_RUN=0), so an exported value is silently dropped and the
# reward would keep dividing by the 20.0 default. arguments.py:1926-1932 setattr's
# every yaml key onto args, and _testcount_scale() checks
# getattr(args, "harbor_testcount_scale") FIRST -- so this path works.
#
# 20 -> 82: measured p90 of the CTRF check-count distribution over the 2087
# valid-CTRF trials of run #1 (p50=15, p75=30, p90=82, p95=128, p99=504). The old
# 20 sat at ~p65, which pushed `rollout/rewards` to ~1.33 mean / 39.7 max and made
# the critic regress onto a 0-40 target. At 82 a p90-sized task scores ~1.0.
harbor_testcount_scale: 82.0

# ------------------------------------------------------------------------------------
# PER-FAMILY divisors: each family's OWN p90.
# ------------------------------------------------------------------------------------
# WHY: the global p90 hides a 795x spread. Measured per-family p90 over the same
# 2087 trials ranges from openfoam_cfd 795 down to openscad_parametric_cad 1. Under a
# single divisor of 82 a FULL solve is worth 9.68 in openfoam and 0.012 in openscad --
# the same achievement, 795x apart -- so `rollout/rewards` tracks which families the
# batch happened to sample rather than policy quality, and the critic's regression
# target is non-stationary. With a per-family divisor a full solve is ~1.0 everywhere.
#
# A family absent from this table falls back to harbor_testcount_scale (82.0).
# Counts (n) are trials observed for that family in run #1; families with small n have
# a correspondingly noisy p90 -- they are still far better than the global 82.
harbor_family_testcount_scales:
  # ===== kxm RESUME19 reward redesign (rollout_distribution_analysis.html) =====
  # D' table tuned FOR reward = float(success) + passed/(passed + D'), NOT for the
  # legacy passed/D. 18 families changed (17 retuned + container added); the other
  # 28 keep their RUN2 p90 divisor. Tags: [x2]=suppress high-scoring failures,
  # [/4]=lift long-horizon low-yield, [fill]=was falling back to global 82.
  openfoam_cfd: 795.0   # n=6, p50=793, max=796
  cmake_build_config: 506.0   # n=111, p50=228, max=508
  tree_sitter_grammar: 132.0   # n=17, p50=104, max=132
  openssl_pki: 110.2   # n=2, p50=87, max=116
  verilog_rtl: 110.0   # n=34, p50=108, max=110
  duckdb_reporting: 88.0   # [x2] was 44.0 -- suppress high-scoring failures
  web_ui_state_machine: 84.0   # n=89, p50=82, max=84
  kicad_pcb: 70.0   # n=209, p50=58, max=70
  nginx_routing: 64.0   # [x2] was 32.0 -- suppress high-scoring failures
  blender_scene_graph: 60.0   # [x2] was 30.0 -- 93 all-fail trajectories at reward ~0.97
  opa_rego_policy: 39.0   # n=63, p50=13, max=39
  sqlite_analytics: 38.0   # [x2] was 19.0 -- suppress high-scoring failures
  color_imaging_pipeline: 30.0   # n=17, p50=30, max=30
  hydrology_raster_modeling: 24.0   # n=45, p50=24, max=24
  robotics_control: 24.0   # n=1, p50=24, max=24
  gdal_geospatial: 22.0   # [x2] was 11.0 -- suppress high-scoring failures
  materials_crystallography: 20.4   # [x2] was 10.2 -- suppress high-scoring failures
  z3_constraint_system: 18.0   # n=54, p50=18, max=18
  structural_biology_pdb: 15.0   # n=79, p50=5, max=15
  music_score_engraving: 15.0   # n=44, p50=10, max=15
  power_grid_simulation: 15.0   # n=185, p50=15, max=15
  seismology_waveform_processing: 15.0   # n=4, p50=15, max=15
  geology_well_log_analysis: 14.0   # n=69, p50=7, max=21
  medical_imaging: 12.0   # n=5, p50=12, max=12
  phylogenetics_tree_reconstruction: 12.0   # n=105, p50=12, max=12
  rf_signal_processing: 12.0   # n=26, p50=4, max=12
