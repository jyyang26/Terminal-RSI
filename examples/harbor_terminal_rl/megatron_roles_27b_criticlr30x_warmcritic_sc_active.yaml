# PPO + Score-Centering (SC) active role config for the 27B dense 256k run.
#
# Derived from megatron_roles_27b_criticlr30x_warmcritic.yaml (RUN2's proven warm-critic
# per-role block) + megatron_roles_27b_criticlr30x_warmcritic_sc_shadow.yaml (which carries
# the SC block at sc_correction_scale: 0.0 for DIAGNOSTIC/shadow mode).
#
# The ONLY difference vs the sc_shadow file is:
#     sc_correction_scale: 0.0  ->  1.0
# i.e. this file actually ADDS the SC gradient term to the PPO loss, whereas the shadow
# file only measures SC without letting it affect the update. See SC_IMPLEMENTATION_REPORT
# section 1.3 (诊断模式与真实训练的区别).
#
# ============================ WHERE THE SC BLOCK LIVES ============================
# score_centering: is a ROOT-LEVEL block, a sibling of `megatron:` -- NOT an entry under
# any role's `overrides`. slime/utils/score_centering_config.py::configure_score_centering
# reads `(role_config).get("score_centering", {})` (line 47) and applies it to the shared
# rollout/actor args BEFORE per-role copies are made; the critic is force-disabled by
# isolate_score_centering_role. Putting enable/k only under the actor's overrides is a
# hard error ("Actor-only SC override ... would desynchronize rollout").
#
# ============================ TB-GAE MUST STAY OFF ============================
# enable_tb_gae: false is explicit here because slime/utils/tb_gae_config.py::
# validate_tb_gae_config requires enable_score_centering == False when TB-GAE is on. The
# two features are mutually exclusive by design. (TB-GAE is also not runnable on the current
# Harbor at all -- see TB_GAE_IMPLEMENTATION_REPORT section "复核 / 可运行性" -- but this
# key keeps the intent unambiguous regardless.)

megatron:
  - name: q38-27b-actor
    role: actor
    overrides:
      lr: 5.0e-7
      min_lr: 5.0e-7
      # clip_grad NOT overridden -> inherits top-level 1.0 (RUN2). value_clip is
      # meaningless for the actor (no value head). SC is an ACTOR-side loss addend and
      # is enabled through the shared score_centering block below, not here.

  - name: q38-27b-critic
    role: critic
    overrides:
      lr: 1.5e-5        # 30x the actor's 5.0e-7 (RUN2)
      min_lr: 1.5e-5
      value_clip: 4.0   # RUN2's actual value (not the 0.2 default)
      clip_grad: 100.0  # RUN2's actual value
      # SC is force-disabled for the critic by isolate_score_centering_role; no key needed.

# ---- shared SC block: applied to rollout + actor, critic auto-disabled ---------------
# TB-GAE off (mutually exclusive with SC, and unrunnable on current Harbor).
enable_tb_gae: false

score_centering:
  enable_score_centering: true      # master switch (this file = REAL SC, scale 1.0)
  sc_correction_scale: 1.0          # 1.0 = SC gradient added to PPO loss (0.0 = shadow only)
  sc_formula: score                 # the GPU-smoked formula (2026-09-26); NOT ppo_weighted
  sc_wire_format: json              # MUST be json: SGLang default head format is unverified;
                                    # the arg/config DEFAULT is 'binary', which would fail on
                                    # an unpatched engine. json is the validated transport.
  sc_top_k: 32                      # top_logprobs_num returned per generated token
  sc_tail_eps: 1.0e-8               # integration fixes this exact value
  sc_weight_denominator: old_actor  # matches PPO's --keep-old-actor denominator; only
                                    # consumed by ppo_weighted, inert for 'score'
  sc_assert_alignment: full         # only 'full' is permitted in production
  sc_chunk_size: 256                # SC softmax workspace chunk (independent of log_probs_chunk_size)
  sc_max_response_bytes: 268435456  # 256 MiB per-request head budget
  sc_max_trial_bytes: 536870912     # 512 MiB per-LLM-instance cumulative head budget
  sc_max_batch_bytes: 34359738368   # 32 GiB raw-head budget before Ray packing.
                                    # RAISED from 8 GiB (2026-09-30): batch 256 needs ~8.26 GiB
                                    # of aggregate SC head bytes (rollout.py:1034 guard tripped
                                    # the formal run at rollout 0). Memory review: nodes have
                                    # 2013 GiB RAM / 1921 GiB free, so 32 GiB (~4x observed, for
                                    # trajectory-length growth over the run) is <2% of host RAM.
