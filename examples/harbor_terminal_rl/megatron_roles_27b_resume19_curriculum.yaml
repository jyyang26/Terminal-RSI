# Megatron per-role config for the iter19 resume with the turn curriculum.
#
# FULL REVERT to run #2's hyperparameters. Every value below was read back out of the
# checkpoint being resumed (iter_0000019/common.pt -> args), not copied from a template,
# so this file is provably what run #2 trained with:
#
#   actor  : lr 5e-07   min_lr 5e-07   clip_grad 1.0    weight_decay 0.1
#   critic : lr 1.5e-05 min_lr 1.5e-05 clip_grad 100.0  value_clip 4.0
#   shared : adam_beta1 0.9  adam_beta2 0.98  lr_decay_style constant
#            eps_clip 0.3  eps_clip_high 5.0  kl_coef 0.0  entropy_coef 0.0
#
# ======================= NOTE ON value_clip: 4.0, NOT 0.2 =======================
# The instruction said "还原为 RUN2 原版值（对齐原版 0.2 或原配置设定）". Both numbers
# appear in the checkpoint, and they mean different things:
#
#   actor  common.pt -> value_clip = 0.2   <- slime's TOP-LEVEL DEFAULT. The actor has
#                                            no value head, so this value was never
#                                            used by anything during run #2.
#   critic common.pt -> value_clip = 4.0   <- the per-role OVERRIDE, i.e. the number
#                                            that actually clipped the value loss.
#
# So 0.2 is the framework default that run #2 deliberately overrode, and 4.0 is run #2's
# real setting. Reverting to run #2 therefore means 4.0. Using 0.2 would be a 20x
# TIGHTENING relative to run #2 -- a new, untested configuration rather than a revert,
# and one that would throttle the value head against the unbounded /82 reward whose
# targets ran to ~14-45. (The 0.08 from the S2 run was calibrated for a bounded [0,1]
# reward and is equally wrong here now that the reward is reverted.)
#
# ============================ WHY clip_grad STAYS SPLIT ============================
# critic 100.0: run #2 measured critic grad_norm 127-409. Against the default 1.0 the
#               gradient was scaled down 100-400x, which is why a cold value head took
#               ~9 steps to become useful. The reward scale is unchanged from run #2,
#               so this headroom is still required.
# actor   1.0 : run #2 measured actor grad_norm 0.13-0.18 -- nowhere near the clip, so
#               the bound is inactive in practice and serves purely as a divergence
#               guard. Left at the inherited top-level 1.0, i.e. NOT overridden here.

megatron:
  - name: q38-27b-actor
    role: actor
    overrides:
      lr: 5.0e-7
      min_lr: 5.0e-7
      # clip_grad deliberately NOT overridden -> inherits the top-level 1.0 (run #2).

  - name: q38-27b-critic
    role: critic
    overrides:
      lr: 1.5e-5        # 30x the actor's 5.0e-7 (run #2)
      min_lr: 1.5e-5
      value_clip: 4.0   # run #2's ACTUAL value (see the note above); NOT 0.2, NOT 0.08
      clip_grad: 100.0  # run #2's actual value
