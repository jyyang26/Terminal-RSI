# synth-ALL RTS config -- Qwen3.5-122B-A10B PPO on the 88-GPU cluster (11 nodes x 8 H20),
# STANDARD (skim-oversample) rollout, DAYTONA backend, hybrid GDN CP=2, batch 256,
# CTRF DENSE (partial / process) reward.
#
# Used by run_tmax15k_122b_a10b_scalable_ppo_criticlr30x_strongest_partial_reward.sh
# (TOPOLOGY=88cp2).
#
# ====================================================================================
# FORKED FROM harbor_tmax15k_72gpu_122b_a10b_daytona_ppo_cp2_bs256_evaltimeout10800.yaml
# ====================================================================================
# ONLY these deltas (EVERYTHING else is byte-identical, deliberately):
#   1. harbor_tasks_dir     tmax15k_terminal_bench -> the RTS synth pool (37484 tasks)
#   2. rollout_shuffle      (new key) -> true
#   3. trials_dir           -> a FRESH run-scoped dir (see "TRIAL DIR ISOLATION" below)
#   4. this comment header
#
# The agent/verifier/environment/timeout/concurrency block is UNTOUCHED so the training
# algorithm and topology stay identical to the validated 88cp2 tmax-15k run: agent
# max_turns 60, proactive_summarization_threshold 20000, max_context_tokens 128000,
# concurrency 280, per-trial wall 5400 s, eval total 10800 s. The ONLY intended
# behavioural change of this run is the REWARD (dense/partial instead of binary).
#
# ====================================================================================
# DATASET: Recursive-Task-Synthesis (37484 tasks), unpacked from the HF release
# ====================================================================================
# Source release lives at
#   /path/to/shared_storage/.../harbor_synth_all_20260725/Recursive-Task-Synthesis
#     data/tasks-0000{0..7}.tar   8 shards x 5000 (last 2484) = 37484
#     metadata/tasks.parquet      37484 rows (task_id / instruction / task_toml / ...)
#     metadata/shard_manifest.jsonl  per-shard task_count + size_bytes + sha256
# Verified before extraction: 37484 parquet rows, task_id 100% UNIQUE (0 collisions),
# validation_status == "passed" for ALL 37484, ~3.4 GB uncompressed.
#
# It MUST be unpacked to a flat pool so that Path.glob("*/task.toml") resolves:
#   for t in data/tasks-*.tar; do tar xf "$t" -C <OUT> --strip-components=1; done
# (--strip-components=1 drops the leading "tasks/" member prefix. task_ids are unique,
#  so all 8 shards can safely extract into ONE directory.)
# The launcher fail-fast-checks the resolved task count before spending any GPU.
#
# >>DO NOT point this at the sibling `dataset/` directory. Those 38573 entries are
# SYMLINKS into /path/to/shared_storage (2820) and /path/to/shared_storage (35753) -- NEITHER mount
# exists on this cluster. Measured: 0 of 300 sampled entries resolve a task.toml, so
# glob returns 0 tasks and the data source fails at init.
#
# ====================================================================================
# CTRF DENSE (PARTIAL / PROCESS) REWARD -- why it works on THIS pool
# ====================================================================================
# Each RTS task's tests/test.sh runs
#   uvx -w pytest-json-ctrf pytest --ctrf /logs/verifier/ctrf.json /tests/test_state.py
# i.e. the pool emits a CTRF json with PER-TEST passed/failed. MEASURED on shard 0:
# 4888/5000 = 97.8% of test.sh contain --ctrf, and the per-task test count is
# 4 (166) / 5 (53) / 6 (35) / 7 (29) / 8-9 (46) / 10+ (~60), max 33 -- i.e. passed/total
# carries a REAL gradient rather than a 0/1 outcome.
#
# slime_plugins/harbor/partial_reward.py::test_count_progress_rewards reads that CTRF
# and returns  shaped = passed_tests / HARBOR_TESTCOUNT_SCALE  (SCALE=20, set in the
# wrapper). This is the ABSOLUTE test count, not the ratio, so a hard many-test task can
# earn more than an easy few-test one instead of being flattened to 1.0. A fully-passed
# task scores total/SCALE (which CAN exceed 1.0 for tasks with >20 tests -- intended;
# PPO's critic+GAE absorbs the scale). Under advantage_estimator=ppo,
# _should_normalize() is False, so raw shaped rewards flow straight into critic + GAE
# with NO group normalization.
#
# Validated offline against 40 REAL trials from the previous 27B run on this same pool:
# 40/40 ctrf parsed, 30 strictly-partial (0<passed<total), 17 distinct reward values.
#
# NOTE the task.toml files already carry cpus=1 / memory_mb=2048 / storage_mb=6144, so
# no environment override_cpus/override_memory_mb is needed here (unlike the 27B yaml).
# override_storage_mb below stays at the parent's 10240 to keep the topology identical.
#
# ====================================================================================
# SHUFFLE (rollout_shuffle: true) -- REQUIRED for this pool
# ====================================================================================
# The pool is assembled in shard/synthesis order, so sorted(glob) would sweep it
# monotonically and each 256-task batch would be drawn from one narrow slice of the
# synthesis rounds. Shuffle reorders the whole pool with a seed+epoch permutation
# (slime/rollout/data_source.py::_ensure_epoch), so every batch mixes difficulties.
#
# ====================================================================================
# TRIAL DIR ISOLATION -- why this MUST be a fresh directory
# ====================================================================================
# Trial dirs are an OUTPUT of training, not an input: each rollout writes
#   <trials_dir>/slime-r{rollout}-g{group}-s{rank}-i{index}/verifier/ctrf.json
# and partial_reward reads that same path back. Nothing needs to be pre-populated.
#
# BUT the name is fully deterministic (slime_plugins/harbor/rollout.py::_trial_name) --
# it contains NO run tag and NO timestamp. If trials_dir pointed at the previous 27B
# run's directory, this run's slime-r0-g0-s0-i0 would collide with the 27B one. In that
# old dir only 47/400 sampled trials have a ctrf.json (353 verifier dirs are empty), so
# whenever a new trial fails to emit its own ctrf (verifier timeout / agent failure --
# common), _load_progress_score would silently read the 27B MODEL's leftover ctrf and
# score THIS run against another model's results. No error, no warning.
# => always a fresh, run-scoped directory. The launcher refuses known-stale paths.
# The old 27B dir is still useful, but ONLY as a read-only regression fixture.

rollout_shuffle: true

# Training pool: the unpacked Recursive-Task-Synthesis corpus (37484 task.toml dirs) on
# the shared fs (all nodes read it directly; no node-local /tmp staging).
harbor_tasks_dir: /path/to/workspace/harbor_synth_all_20260725/dataset_rts
harbor_tasks_glob: "*/task.toml"

# Held-out EVAL pool: the 89 Terminal-Bench 2 tasks (gy4 share, all nodes see it).
# Unchanged from the parent yaml -- these DO emit ctrf.json (verified in past eval runs).
harbor_eval_tasks_dir: /path/to/workspace/terminal-bench-2-main
harbor_eval_tasks_glob: "*/task.toml"

harbor_trial_defaults:
  # FRESH, run-scoped. Never reuse the 27B synth_all_38k_ppo_dense_shuffle_* dirs.
  trials_dir: /path/to/workspace/slime_harbor_trials/synth_all_rts_122b_a10b_ppo_partial_reward
  timeout_multiplier: 1.0
  agent:
    import_path: slime_plugins.harbor.agent:SlimeTerminus2
    model_name: slime-policy
    override_timeout_sec: 3600
    kwargs:
      parser_name: json
      max_turns: 60
      collect_rollout_details: true
      enable_summarize: true
      proactive_summarization_threshold: 20000
      trajectory_config:
        raw_content: true
        linear_history: true
      record_terminal_session: false
      llm_backend: slime_sglang
      llm_kwargs:
        apply_chat_template_kwargs:
          enable_thinking: false
        max_context_tokens: 128000
  verifier:
    override_timeout_sec: 900
  environment:
    type: daytona
    delete: true
    override_storage_mb: 10240
    kwargs:
      connection_pool_maxsize: 128
      auto_stop_interval_mins: 90
      auto_delete_interval_mins: 10

harbor_sample_mode: trajectory_retokenized
harbor_group_unit: trajectory
harbor_reward_key: reward

# n=1: group==task==sandbox. Fly 280 concurrent groups (max_concurrent_groups), accept
# the first 256 completed (rollout_batch_size in the wrapper), drop the slow tail.
# num_concurrent_trials is the sandbox-level semaphore; keep >= the in-flight cap.
harbor_num_concurrent_trials: 280
harbor_fully_async_max_concurrent_groups: 280
harbor_partial_group_min_units: 1

# Daytona per-org create limit 600/min (=10/s); pace to 6/s (matches source).
harbor_create_rate_per_sec: 6.0
harbor_create_rate_burst: 6.0

harbor_trial_node_spread: true
harbor_trials_per_node: 35
harbor_trial_worker_num_cpus: 0.05
harbor_trial_worker_startup_timeout_sec: 120
harbor_trial_worker_healthcheck_timeout_sec: 30
harbor_kill_unhealthy_trial_workers: false
harbor_fallback_to_inprocess_trials: false
harbor_trial_remote_timeout_sec: 5400

harbor_eval_total_timeout_sec: 10800
rollout_cleanup_function_path: slime_plugins.harbor.fully_async_rollout.cleanup_rollout
harbor_fully_async_shutdown_drain_timeout_sec: 30
harbor_fully_async_shutdown_join_timeout_sec: 45

harbor_fail_on_conversion_error: true
harbor_fail_on_trial_error: false
harbor_require_full_rollout_groups: false
harbor_rollout_group_attempt_multiplier: 12
harbor_retry_missing_samples: 0
