# Megatron per-role config for the FRESH PPO run off the Qwen3.8-27B base model.
#
# Values are IDENTICAL to the run that was just stopped (megatron_roles_27b_resume19_curriculum.yaml),
# which in turn were read back out of run #2's own iter_0000019/common.pt:
#
#   actor  : lr 5e-07   min_lr 5e-07   clip_grad 1.0    weight_decay 0.1
#   critic : lr 1.5e-05 min_lr 1.5e-05 clip_grad 100.0  value_clip 4.0
#   shared : adam_beta1 0.9  adam_beta2 0.98  lr_decay_style constant
#            eps_clip 0.3  eps_clip_high 5.0  kl_coef 0.0  entropy_coef 0.0
#
# The instruction is to inherit the mature configuration wholesale (topology, the 30x
# critic:actor lr ratio, the critic-specific knobs), so this file is a verbatim carry-over.
# Nothing here is re-tuned for the base model.
#
# ===================== value_clip 4.0 IS RIGHT FOR A COLD HEAD TOO =====================
# 4.0 was chosen in run #2 to let a value head re-calibrate freely (the clip is on the
# value DELTA, loss.py:1183 |values - old_values| > value_clip). A COLD head -- randomly
# initialised, normal_(0, 0.02) -- needs at least as much freedom: its first predictions
# are ~0 while the /82 reward's returns run to ~14-45, so the early deltas are large by
# construction. A tight clip would truncate exactly the updates the warmup exists to make.
#
# ============================ WHY clip_grad STAYS SPLIT ============================
# critic 100.0: run #1 measured critic grad_norm 198-2193 from a COLD head against the
#               default clip 1.0, i.e. the gradient was scaled down up to ~2000x -- the
#               dominant reason explained_variance took ~9 steps to cross 0. This run is
#               cold again AND only gets 2 warmup steps, so the headroom matters more
#               here than it did in the warm-start runs.
# actor   1.0 : run #2 measured actor grad_norm 0.13-0.18 (run #1: 0.25-5.2) -- at or
#               below the clip, so it acts purely as a divergence guard. Left at the
#               inherited top-level 1.0, i.e. NOT overridden here. Loosening it would
#               risk the policy, which is the thing being protected.
#
# Everything not listed is deepcopy-inherited per role: _apply_megatron_role_overrides
# (arguments.py:1600-1634) applies these keys onto a copy.deepcopy(base_args), which is
# also why the TOP-LEVEL args dump prints the BASE value_clip (0.2) rather than 4.0 --
# that dump is the actor's, and the actor has no value head. The critic's override is
# confirmed by the "overrides = [...] for role=critic" log line, not by the dump.

megatron:
  - name: q38-27b-actor
    role: actor
    overrides:
      lr: 5.0e-7
      min_lr: 5.0e-7
      # clip_grad deliberately NOT overridden -> inherits the top-level 1.0 (run #2).

  - name: q38-27b-critic
    role: critic
    overrides:
      lr: 1.5e-5        # 30x the actor's 5.0e-7 (run #2)
      min_lr: 1.5e-5
      value_clip: 4.0   # run #2's actual value; NOT the 0.2 top-level default
      clip_grad: 100.0  # run #2's actual value
